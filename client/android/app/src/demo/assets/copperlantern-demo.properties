# Packaged only when POS_DEMO_BUILD=true at build time.
# This affects the tablet-hosted staff ordering app, not the owner web portal.
staff.app.mfa.required=false
# Demo mode (staff app by PIN only, "Print demo QR sheet"). The tablet's
# store.properties demo.mode wins over this; demo.portal.* is only ever read
# from store.properties (never baked into an APK).
demo.mode=on
