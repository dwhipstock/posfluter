# Independent production stack for the internet-facing manager portal.
# Images are built by .github/workflows/build.yml and selected by immutable SHA.
name: copper-lantern-manager

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_cloud
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
    volumes:
      - manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: "${REGISTRY:?set REGISTRY in .env}/pos-cloud-api:${IMAGE_TAG:?set IMAGE_TAG in .env}"
    restart: unless-stopped
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/pos_cloud"
      DB_USER: pos
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      PORT: "8081"
      MIGRATIONS_DIR: /app/migrations
      ADMIN_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      TOTP_REQUIRED: "${TOTP_REQUIRED:-true}"
      STORE_API_KEY: "${STORE_API_KEY:?set STORE_API_KEY in .env}"
      # extra stores: "<venueId>=<key>,…"; the tenant's stores: "<venueId>=<name>,…" (first = primary)
      STORE_API_KEYS: "${STORE_API_KEYS:-}"
      STORES: "${STORES:-}"
      COOKIE_SECURE: "true"
      # portal sign-out: idle minutes (background polls don't count) + absolute cap in hours
      PORTAL_SESSION_IDLE_MINUTES: "${PORTAL_SESSION_IDLE_MINUTES:-60}"
      PORTAL_SESSION_MAX_HOURS: "${PORTAL_SESSION_MAX_HOURS:-12}"
      VENUE_NAME: "${VENUE_NAME:-Copper Lantern}"
      VENUE_TZ: "${VENUE_TZ:-America/New_York}"
      PUBLIC_BASE_DOMAIN: "${PUBLIC_BASE_DOMAIN:-lostmindllc.com}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    image: "${REGISTRY:?set REGISTRY in .env}/pos-cloud-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:?set IMAGE_TAG in .env}}"
    restart: unless-stopped
    environment:
      API_ORIGIN: "http://api:8081"
    depends_on:
      api:
        condition: service_healthy

  # This demo keeps its customer/table menu beside the manager stack so the
  # Copper Lantern hostname has a real store backend instead of falling
  # through the shared venue proxy to a missing container.
  store:
    image: "${REGISTRY:?set REGISTRY in .env}/pos-store:${IMAGE_TAG:?set IMAGE_TAG in .env}"
    restart: unless-stopped
    environment:
      POS_DB: /data/pos.db
      POS_RECEIPTS_DIR: /data/receipts
      POS_BILLS_DIR: /data/bills
      POS_PHOTOS_DIR: /data/photos
      POS_PUBLIC_URL: "https://${STORE_DOMAIN:?set STORE_DOMAIN in .env}"
      POS_SEED: copperlantern
      # This is an isolated, disposable demo: avoid a fresh device-pairing
      # ceremony whenever the boss opens the tablet app.
      POS_REQUIRE_DEVICE_TOKEN: "false"
      POS_XMX: "256m"
      CLOUD_SYNC_URL: "http://api:8081"
      CLOUD_SYNC_API_KEY: "${STORE_API_KEY:?set STORE_API_KEY in .env}"
      CLOUD_SYNC_INTERVAL_SECONDS: "10"
      REPORTING_PORTAL_URL: "https://${DOMAIN:?set DOMAIN in .env}"
      TZ: America/New_York
    volumes:
      - manager_storedata:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  caddy:
    image: "${REGISTRY:?set REGISTRY in .env}/pos-cloud-caddy:${IMAGE_TAG:?set IMAGE_TAG in .env}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      LEGACY_DOMAIN: "${LEGACY_DOMAIN:?set LEGACY_DOMAIN in .env}"
      STORE_DOMAIN: "${STORE_DOMAIN:?set STORE_DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}"
    volumes:
      - ./Caddyfile.manager:/etc/caddy/Caddyfile:ro
      - manager_caddy_data:/data
      - manager_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      store:
        condition: service_healthy

volumes:
  manager_pgdata:
  manager_storedata:
  manager_caddy_data:
  manager_caddy_config:
